apiVersion: v1
kind: Service
metadata:
  name: {{ include "safesqlproxy.fullname" . }}
  labels:
    {{- include "safesqlproxy.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "safesqlproxy.selectorLabels" . | nindent 4 }}
  ports:
    - name: rest
      port: {{ .Values.service.restPort }}
      targetPort: rest
    - name: mcp
      port: {{ .Values.service.mcpPort }}
      targetPort: mcp
